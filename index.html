<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />

    <!--
      PRIVATE PANEL — must never be indexed.

      These tags are a fallback only. A crawler has to fetch and parse the page
      to see them, and a hostile one ignores them entirely. The enforcing
      control is the `X-Robots-Tag` HTTP header set in deploy/nginx.conf and
      deploy/Caddyfile, plus the fact that everything is behind authentication.

      There is deliberately NO description, no Open Graph and no Twitter card:
      those exist to make a page shareable and quotable, which is the opposite
      of what this is.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f0e0c'/%3E%3Cpath d='M5 16h3l2-6 3 12 3-14 3 16 3-10 2 4h3' fill='none' stroke='%23d4a853' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!--
      A neutral title. If the hostname ever leaks into a log, a referrer or a
      screenshot, it should say as little as possible about what this is or
      who operates it.
    -->
    <title>Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
