# ---------------------------------------------------------------------------
# nginx reference configuration for the private panel.
#
# This is the layer where security is actually ENFORCED. Everything the React
# bundle does is a convenience for the user; a header set here cannot be
# skipped by an attacker, and a user agent refused here never reaches the app.
#
# Adapt the hostname, certificate paths and upstream, then verify with:
#   curl -sI https://<host>/ | sort
#   https://securityheaders.com  and  https://observatory.mozilla.org
# ---------------------------------------------------------------------------

# Named map: user agents that are refused outright at the edge.
# `~*` is a case-insensitive regex. Matching on User-Agent is trivially
# spoofable, so this is a courtesy filter for HONEST bots, not a security
# control. The real control is that everything requires authentication.
map $http_user_agent $blocked_agent {
    default 0;

    # AI training / dataset crawlers
    "~*gptbot"                      1;
    "~*oai-searchbot"               1;
    "~*chatgpt-user"                1;
    "~*claudebot"                   1;
    "~*claude-user"                 1;
    "~*claude-searchbot"            1;
    "~*claude-web"                  1;
    "~*anthropic-ai"                1;
    "~*google-extended"             1;
    "~*googleother"                 1;
    "~*cloudvertexbot"              1;
    "~*notebooklm"                  1;
    "~*applebot-extended"           1;
    "~*meta-external"               1;
    "~*meta-webindexer"             1;
    "~*facebookbot"                 1;
    "~*perplexity"                  1;
    "~*bytespider"                  1;
    "~*tiktokspider"                1;
    "~*ccbot"                       1;
    "~*amazonbot"                   1;
    "~*mistralai"                   1;
    "~*duckassistbot"               1;
    "~*deepseekbot"                 1;
    "~*kimibot"                     1;
    "~*pangubot"                    1;
    "~*petalbot"                    1;
    "~*youbot"                      1;
    "~*cohere"                      1;
    "~*ai2bot"                      1;
    "~*diffbot"                     1;
    "~*timpibot"                    1;
    "~*omgili"                      1;
    "~*webzio"                      1;
    "~*imagesiftbot"                1;
    "~*img2dataset"                 1;
    "~*firecrawl"                   1;
    "~*bedrockbot"                  1;
    "~*icc-crawler"                 1;
    "~*sbintuitionsbot"             1;
    "~*linerbot"                    1;

    # Search engines
    "~*googlebot"                   1;
    "~*bingbot"                     1;
    "~*slurp"                       1;
    "~*duckduckbot"                 1;
    "~*baiduspider"                 1;
    "~*yandex"                      1;
    "~*applebot"                    1;
    "~*sogou"                       1;

    # SEO / marketing scrapers
    "~*ahrefsbot"                   1;
    "~*semrushbot"                  1;
    "~*dataforseobot"               1;
    "~*mj12bot"                     1;
    "~*dotbot"                      1;
    "~*blexbot"                     1;
    "~*zoominfobot"                 1;

    # Archivers
    "~*ia_archiver"                 1;
    "~*archive.org_bot"             1;

    # Generic scraping tooling. Remove if you use these for monitoring.
    "~*scrapy"                      1;
    "~*python-requests"             1;
    "~*headlesschrome"              1;
    "~*phantomjs"                   1;

    # An empty User-Agent is almost always automation.
    ""                              1;
}

# HTML must never sit in a shared cache; hashed assets can be cached forever.
map $uri $html_cache {
    default                              "no-store, no-cache, must-revalidate, private";
    "~*^/assets/"                        "public, max-age=31536000, immutable";
    "~*^/robots\.txt$"                   "public, max-age=3600";
}

# Rate limiting for the login endpoint. Credential stuffing is the single most
# likely attack on a panel like this, and it is cheap to blunt here.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=app_zone:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# Redirect plain HTTP. No content is ever served over cleartext.
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    # TLS 1.2 is retained only for older client devices. Drop to 1.3-only if
    # every user is on a current browser.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling so clients do not leak their visit to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;

    # --- Fingerprinting ----------------------------------------------------
    server_tokens off;
    more_clear_headers Server;          # requires headers-more-nginx-module
    more_clear_headers X-Powered-By;

    # --- Crawler refusal ---------------------------------------------------
    # 404, not 403: a 403 confirms something exists here. A 404 is a flat
    # "there is nothing at this address", which is what we want a scanner to
    # record.
    if ($blocked_agent) {
        return 404;
    }

    # --- Security headers, on EVERY response including errors --------------
    # `always` matters: without it nginx omits these on 4xx/5xx, which is
    # exactly when an error page might reflect content.

    # Keep this panel out of every index, in a way robots.txt cannot be.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" always;

    # 2 years, subdomains included, preload-eligible. Only enable `preload`
    # once every subdomain is on valid TLS — removal takes months.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP — verified against the ACTUAL build artifact by
    # src/__tests__/cspCompatibility.test.ts, which parses dist/index.html and
    # fails if anything the policy would block is emitted.
    #
    # The build deliberately does NOT use vite-plugin-singlefile: that inlines
    # the app into a nonce-less <script>, which `script-src 'self'` blocks.
    # Vite emits hashed external assets instead, so the policy needs no
    # 'unsafe-inline', no 'unsafe-eval' and no hash allow-list.
    #
    # style-src-attr is the ONE narrow exception: React writes `style={...}`
    # props as inline style attributes on elements. That directive covers only
    # attributes — it does NOT permit <style> blocks or inline <script>, and it
    # cannot be used to execute code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;              # legacy backstop
    add_header Referrer-Policy "no-referrer" always;       # never leak the URL

    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

    # Cross-origin isolation.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Deprecated and actively harmful in some browsers — explicitly disabled.
    add_header X-XSS-Protection "0" always;

    # --- Request hygiene ---------------------------------------------------
    client_max_body_size 8m;        # matches the app's upload caps
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn conn_zone 24;

    # Refuse methods the SPA never uses.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- Routes ------------------------------------------------------------

    # Sensitive HTML must never be cached by a shared proxy. Applied via the
    # map below so it also covers the slug-prefixed entry point.
    add_header Cache-Control $html_cache always;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # There is no sitemap, and there never should be.
    location = /sitemap.xml { return 404; }

    # Hide dot-files and source maps. A source map hands an attacker your
    # original TypeScript.
    location ~ /\. { return 404; }
    location ~ \.map$ { return 404; }

    # Login: aggressively rate limited. `burst=3 nodelay` lets a human who
    # fat-fingers their password retry immediately, while a scripted attack
    # hits the 5/minute ceiling almost at once.
    location /api/v1/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=app_zone burst=20 nodelay;
        add_header Cache-Control "no-store, private" always;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    root /var/www/panel;
    index index.html;

    # --- Secret access path -------------------------------------------------
    #
    # OBSCURITY, NOT AUTHENTICATION. A URL leaks through browser history, the
    # Referer header, bookmark sync and screenshots. This removes opportunistic
    # internet-wide scanners so the panel never lands in a "hosts running X"
    # dataset. It is NOT a second factor and must never be counted as one.
    #
    # Enforcing it HERE matters: the in-app gate still serves the JavaScript
    # bundle to anyone who asks, and the slug is compiled into that bundle.
    # Refusing at the edge means a wrong URL receives no application code at
    # all.
    #
    # nginx cannot interpolate a variable into a `location` prefix, so the slug
    # is written literally below. Substitute it at deploy time (envsubst, or
    # your config-management tool) using the SAME value passed to the build as
    # VITE_ACCESS_PATH — they must match or the app-level gate rejects.
    #
    # If you are not using an access path, delete the two blocks below and
    # replace them with the plain SPA fallback in the comment that follows.

    # 1. The application entry point, reachable ONLY under the slug.
    location ^~ /__ACCESS_PATH__ {
        # Keep the slug out of the access log: a log file is exactly the kind
        # of place a "secret" URL stops being secret.
        access_log off;
        alias /var/www/panel/;
        try_files $uri $uri/ /index.html;
    }

    # 2. Hashed assets. index.html references them by absolute path, so they
    #    live outside the slug prefix and must stay reachable. They contain no
    #    secrets beyond the bundle itself, which the slug holder already has.
    #    Content-hashed filenames make them safe to cache immutably (see the
    #    $html_cache map above).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # 3. Everything else looks like an empty server.
    location / {
        return 404;
    }

    # WITHOUT an access path, replace blocks 1-3 with:
    #   location / { try_files $uri $uri/ /index.html; }

    # --- Logging -----------------------------------------------------------
    # The default log format records the full query string. Never put a token
    # or a national ID in a URL; if you must log, strip $args.
    access_log /var/log/nginx/panel.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/panel.error.log warn;
}
